services:
  db:
    image: postgres:16-alpine
    container_name: shortlink-postgres
    environment:
      POSTGRES_DB: shortlinks
      POSTGRES_USER: shortlinks
      POSTGRES_PASSWORD: shortlinks
    ports:
      - "5432:5432"
    volumes:
      - shortlink-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortlinks -d shortlinks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shortlink-data:
