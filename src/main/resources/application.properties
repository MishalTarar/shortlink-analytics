spring.application.name=shortlink-analytics
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shortlinks}
spring.datasource.username=${DB_USERNAME:shortlinks}
spring.datasource.password=${DB_PASSWORD:shortlinks}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.base-url=${APP_BASE_URL:http://localhost:8080}
